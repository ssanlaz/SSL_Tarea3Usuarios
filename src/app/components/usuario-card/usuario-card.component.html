<div class="card shadow border-1 border text-center p-3">
    <img [src]="miUsuario.image" class="card-img-top rounded-circle mt-3 mx-auto" alt="Foto de usuario"  height="200">
         <h5>{{miUsuario.first_name}}</h5> 
         <p>{{miUsuario.last_name}}</p>
      <hr class="border border-2 border-success">
      <!--Insertamos aqui en componente de los botones-->
      <app-botones [parent]="'card'" [_id]= "miUsuario._id" [miUsuario]= "miUsuario"></app-botones>
     
</div>
